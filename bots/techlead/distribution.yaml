name: techlead
version: 0.1.0
description: "Tech Lead: escreve a story BMAD técnica com DoR, quebra em tasks no TUPLE, pede o GATE 2 e gera o .kiro/specs para os devs."
hermes_requires: ">=0.21.0"
author: "Joao Pires"
license: "proprietary"

env_requires:
  - name: TUPLE_API_KEY
    description: "API key do Tuple (age como o membro que a criou)"
    required: true
  - name: HERMES_KIRO_ACP_COMMAND
    description: "Binário que o provider kiro-acp executa (kiro-pool limita a 4 sessões)"
    required: false
    default: "kiro-pool"
  - name: HERMES_KIRO_ACP_ARGS
    description: "Argumentos do kiro-cli: agente Kiro deste bot"
    required: false
    default: "acp --agent hermes-techlead"
