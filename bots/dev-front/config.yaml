# Bot @dev-front — gerado por scripts/gen_bots.py
model:
  default: "auto"
  provider: "kiro-acp"

agent:
  bot_mode_protocol: true

display:
  pet:
    enabled: true
    slug: "foxlynn"

platform_toolsets:
  cli:
    - clarify
    - memory
    - session_search
    - skills
    - todo
    - file
    - terminal
    - browser
  telegram:
    - clarify
    - memory
    - session_search
    - skills
    - todo
    - file
    - terminal
    - browser

approvals:
  deny:
    - "*--by humano*"
    - "*--by=humano*"
    - "*--by @humano*"
    - "*call-dispatch*"
    - "*hermes-delegar orquestrador*"
    - "*hermes -p *"
    - "*hermes chat*"

browser:
  backend: "browser-use"
  cloud_provider: "local"
