name: dev-front
version: 0.1.0
description: "Dev Front: implementa a story aprovada no repo de front numa sessão kiro-cli, commit/push na branch do time, abre PR e move a issue para IN_REVIEW."
hermes_requires: ">=0.21.0"
author: "Joao Pires"
license: "proprietary"

env_requires:
  - name: HERMES_KIRO_ACP_COMMAND
    description: "Binário que o provider kiro-acp executa (kiro-pool limita a 4 sessões)"
    required: false
    default: "kiro-pool"
  - name: HERMES_KIRO_ACP_ARGS
    description: "Argumentos do kiro-cli: agente Kiro deste bot"
    required: false
    default: "acp --agent hermes-dev-front"
