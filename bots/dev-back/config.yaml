# Bot @dev-back — gerado por scripts/gen_bots.py
model:
  default: "auto"
  provider: "kiro-acp"

agent:
  bot_mode_protocol: true

display:
  pet:
    enabled: true
    slug: "fat-robot"

platform_toolsets:
  cli:
    - clarify
    - memory
    - session_search
    - skills
    - todo
    - file
    - terminal
  telegram:
    - clarify
    - memory
    - session_search
    - skills
    - todo
    - file
    - terminal

approvals:
  deny:
    - "*--by humano*"
    - "*--by=humano*"
    - "*--by @humano*"
    - "*call-dispatch*"
    - "*hermes-delegar orquestrador*"
    - "*hermes -p *"
    - "*hermes chat*"
