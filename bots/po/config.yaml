# Bot @po — gerado por scripts/gen_bots.py
model:
  default: "claude-sonnet-5-5"
  provider: "anthropic"

agent:
  bot_mode_protocol: true

display:
  pet:
    enabled: true
    slug: "peri-the-owl"

platform_toolsets:
  cli:
    - clarify
    - memory
    - session_search
    - skills
    - todo
    - file
    - terminal
  telegram:
    - clarify
    - memory
    - session_search
    - skills
    - todo
    - file
    - terminal

approvals:
  deny:
    - "*--by humano*"
    - "*--by=humano*"
    - "*--by @humano*"
    - "*call-dispatch varrer*"
    - "*call-dispatch cliente*"
    - "*call-dispatch novo*"
    - "*call-dispatch aprovar*"
    - "*call-dispatch ajustar*"
    - "*call-dispatch rejeitar*"
    - "*call-dispatch ignorar*"
    - "*hermes-delegar orquestrador*"
    - "*hermes -p *"
    - "*hermes chat*"

telegram:
  require_mention: true
  exclusive_bot_mentions: true
