name: po
version: 0.1.0
description: "Product Owner: antes do GATE 1, extrai as evidências da call, prova o que já existe e escreve a proposta curta de decisão + os corpos das issues; depois, mantém PRD/épicos/stories BMAD em docs/."
hermes_requires: ">=0.21.0"
author: "Joao Pires"
license: "proprietary"

env_requires:
  - name: HERMES_KIRO_ACP_COMMAND
    description: "Binário que o provider kiro-acp executa (kiro-pool limita a 4 sessões)"
    required: false
    default: "kiro-pool"
  - name: HERMES_KIRO_ACP_ARGS
    description: "Argumentos do kiro-cli: agente Kiro deste bot"
    required: false
    default: "acp --agent hermes-po"
