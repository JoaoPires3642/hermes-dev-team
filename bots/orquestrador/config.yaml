# Bot @orquestrador — gerado por scripts/gen_bots.py
model:
  default: "claude-opus-5"
  provider: "anthropic"

agent:
  bot_mode_protocol: true

display:
  pet:
    enabled: true
    slug: "octopus"

platform_toolsets:
  cli:
    - clarify
    - memory
    - session_search
    - skills
    - todo
    - cronjob
    - file
    - terminal
  telegram:
    - clarify
    - memory
    - session_search
    - skills
    - todo
    - cronjob
    - file
    - terminal

approvals:
  deny:
    - "*--by humano*"
    - "*--by=humano*"
    - "*--by @humano*"
    - "*call-dispatch*"
    - "*hermes-delegar orquestrador*"
    - "*hermes -p *"
    - "*hermes chat*"

plugins:
  enabled:
    - hermes-gates
