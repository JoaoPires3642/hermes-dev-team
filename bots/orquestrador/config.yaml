# Bot @orquestrador — gerado por scripts/gen_bots.py
model:
  default: "claude-opus-5"
  provider: "anthropic"

agent:
  bot_mode_protocol: true

display:
  pet:
    enabled: true
    slug: "octopus"

platform_toolsets:
  cli:
    - clarify
    - memory
    - session_search
    - skills
    - todo
    - cronjob
    - file
    - terminal
  telegram:
    - clarify
    - memory
    - session_search
    - skills
    - todo
    - cronjob
    - file
    - terminal

approvals:
  deny:
    - "*--by humano*"
    - "*--by=humano*"
    - "*--by @humano*"
    - "*call-dispatch varrer*"
    - "*call-dispatch cliente*"
    - "*call-dispatch novo*"
    - "*call-dispatch aprovar*"
    - "*call-dispatch ajustar*"
    - "*call-dispatch rejeitar*"
    - "*call-dispatch ignorar*"
    - "*hermes-delegar orquestrador*"
    - "*hermes -p * chat*"
    - "*hermes -p * send*"
    - "*hermes chat*"

telegram:
  require_mention: false
  exclusive_bot_mentions: true

plugins:
  enabled:
    - hermes-gates
