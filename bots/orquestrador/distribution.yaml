name: orquestrador
version: 0.1.0
description: "Porta de entrada: numa sessão por call (aberta pelo call-dispatch), entende a conversa com o cliente, escreve o resumo e passa ao @po. No Telegram, orienta e aponta os comandos dos gates."
hermes_requires: ">=0.21.0"
author: "Joao Pires"
license: "proprietary"

env_requires:
  - name: HERMES_KIRO_ACP_COMMAND
    description: "Binário que o provider kiro-acp executa (kiro-pool limita a 4 sessões)"
    required: false
    default: "kiro-pool"
  - name: HERMES_KIRO_ACP_ARGS
    description: "Argumentos do kiro-cli: agente Kiro deste bot"
    required: false
    default: "acp --agent hermes-orquestrador"
