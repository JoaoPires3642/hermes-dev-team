name: qa
version: 0.1.0
description: "QA: escreve e roda testes, revisa o diff contra os CAs; falhou devolve ao dev com evidência, passou libera o PR."
hermes_requires: ">=0.21.0"
author: "Joao Pires"
license: "proprietary"

env_requires:
  - name: TUPLE_API_KEY
    description: "API key do Tuple (age como o membro que a criou)"
    required: true
  - name: HERMES_KIRO_ACP_COMMAND
    description: "Binário que o provider kiro-acp executa (kiro-pool limita a 4 sessões)"
    required: false
    default: "kiro-pool"
  - name: HERMES_KIRO_ACP_ARGS
    description: "Argumentos do kiro-cli: agente Kiro deste bot"
    required: false
    default: "acp --agent hermes-qa"
